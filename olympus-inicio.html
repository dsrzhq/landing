<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olympus — Inicio</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logos/DSRZ_favicon_silhouette.svg">
  <style>
    @font-face { font-family:'Space Grotesk'; font-weight:500; font-style:normal; font-display:swap; src:url('/fonts/SpaceGrotesk-Medium.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-weight:400; font-style:normal; font-display:swap; src:url('/fonts/Inter_18pt-Regular.woff2') format('woff2'); }
    :root { --obsidian:#111111; --white:#FFFFFF; --momentum-blue:#2563EB; --slate-300:#D1D5DB; --font-display:'Space Grotesk','Helvetica Neue',Arial,sans-serif; --font-ui:'Inter','Helvetica Neue',Arial,sans-serif; }
    *, *::before, *::after { box-sizing:border-box; }
    html, body { min-height:100%; }
    body { min-height:100vh; margin:0; background:var(--white); color:var(--obsidian); font-family:var(--font-ui); }
    header { padding:24px; border-bottom:1px solid var(--slate-300); display:flex; justify-content:space-between; align-items:center; }
    .logo { height:28px; }
    .logo img { height:100%; width:auto; }
    a { color:var(--momentum-blue); text-decoration:none; font-weight:500; }
    main { max-width:1200px; margin:0 auto; padding:64px 24px; }
    h1 { margin:0 0 16px 0; font-family:var(--font-display); font-size:36px; font-weight:500; letter-spacing:-0.02em; }
    p { margin:0 0 32px 0; font-size:16px; line-height:1.6; color:#6B7280; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><a href="/"><img src="/assets/logos/DSRZ_isotype_black.svg" alt="DSRZ"></a></div>
    <a href="/">Volver a DSRZ HQ</a>
  </header>
  <main>
    <h1>Bienvenido a Olympus</h1>
    <p>Accediste correctamente. Este es el espacio de Olympus.</p>
    <p>Contenido y funcionalidad disponibles próximamente.</p>
  </main>
</body>
</html>
