<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitud recibida. — DSRZ HQ</title>
  <meta name="description" content="Solicitud recibida. DSRZ HQ revisará tu información.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logos/DSRZ_favicon_silhouette.svg">
  <style>
    /* ── FONTS (self-hosted, paths relative to this file) ────────────────── */
    @font-face { font-family:'Space Grotesk'; font-weight:300; font-style:normal; font-display:swap; src:url('fonts/SpaceGrotesk-Light.woff2') format('woff2'); }
    @font-face { font-family:'Space Grotesk'; font-weight:400; font-style:normal; font-display:swap; src:url('fonts/SpaceGrotesk-Regular.woff2') format('woff2'); }
    @font-face { font-family:'Space Grotesk'; font-weight:500; font-style:normal; font-display:swap; src:url('fonts/SpaceGrotesk-Medium.woff2') format('woff2'); }
    @font-face { font-family:'Space Grotesk'; font-weight:600; font-style:normal; font-display:swap; src:url('fonts/SpaceGrotesk-SemiBold.woff2') format('woff2'); }
    @font-face { font-family:'Space Grotesk'; font-weight:700; font-style:normal; font-display:swap; src:url('fonts/SpaceGrotesk-Bold.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-weight:400; font-style:normal; font-display:swap; src:url('fonts/Inter_18pt-Regular.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-weight:500; font-style:normal; font-display:swap; src:url('fonts/Inter_18pt-Medium.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-weight:600; font-style:normal; font-display:swap; src:url('fonts/Inter_18pt-SemiBold.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-weight:700; font-style:normal; font-display:swap; src:url('fonts/Inter_18pt-Bold.woff2') format('woff2'); }
    @font-face { font-family:'Source Serif 4'; font-weight:400; font-style:normal; font-display:swap; src:url('fonts/SourceSerif4-Regular.woff2') format('woff2'); }
    @font-face { font-family:'Source Serif 4'; font-weight:600; font-style:normal; font-display:swap; src:url('fonts/SourceSerif4-SemiBold.woff2') format('woff2'); }
    @font-face { font-family:'Source Serif 4'; font-weight:400; font-style:italic; font-display:swap; src:url('fonts/SourceSerif4-Italic.woff2') format('woff2'); }

    /* ── DESIGN TOKENS ───────────────────────────────────────────────────── */
    :root {
      --obsidian:      #111111;
      --white:         #FFFFFF;
      --momentum-blue: #2563EB;
      --impact-cyan:   #06B6D4;
      --signal-amber:  #F59E0B;
      --deep-navy:     #0F172A;
      --slate-900: #1F2937; --slate-700: #374151;
      --slate-500: #6B7280; --slate-300: #D1D5DB; --slate-100: #F3F4F6;
      --fg-1: var(--obsidian);  --fg-2: var(--slate-700); --fg-3: var(--slate-500);
      --line-1: var(--slate-300); --line-on-dark: rgba(255,255,255,0.15);
      --accent: var(--momentum-blue); --accent-hover: #1D4ED8; --accent-press: #1E40AF;
      --font-display: 'Space Grotesk','Helvetica Neue',Arial,sans-serif;
      --font-ui:      'Inter','Helvetica Neue',Arial,sans-serif;
      --font-serif:   'Source Serif 4',Georgia,'Times New Roman',serif;
      --ease-standard: cubic-bezier(0.4,0.0,0.2,1);
      --dur: 200ms; --dur-fast: 120ms; --dur-slow: 360ms;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--obsidian);
      color: var(--white);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      text-align: center;
    }
    .thanks { width: min(100%, 680px); }
    .lockup { width: min(220px, 65vw); margin: 0 auto 72px; }
    .lockup img { display: block; width: 100%; height: auto; }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(42px, 7vw, 76px);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }
    p {
      max-width: 470px;
      margin: 24px auto 32px;
      color: var(--slate-300);
      font-size: 17px;
      line-height: 1.65;
    }
    a {
      color: var(--white);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    a:hover { color: var(--impact-cyan); }
    a:focus-visible { outline: 2px solid var(--momentum-blue); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <section class="thanks" aria-labelledby="thanks-title">
      <div class="lockup">
        <img src="assets/logos/DSRZ_lockup_horizontal_inverted.svg" alt="DSRZ HQ">
      </div>
      <h1 id="thanks-title">Solicitud recibida.</h1>
      <p>Revisaremos tu información y te escribiremos pronto.</p>
      <a href="/">Volver a la portada</a>
    </section>
  </main>
</body>
</html>
