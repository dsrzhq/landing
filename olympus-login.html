<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olympus — Acceso</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logos/DSRZ_favicon_silhouette.svg">
  <style>
    @font-face { font-family:'Space Grotesk'; font-weight:500; font-style:normal; font-display:swap; src:url('/fonts/SpaceGrotesk-Medium.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-weight:400; font-style:normal; font-display:swap; src:url('/fonts/Inter_18pt-Regular.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-weight:500; font-style:normal; font-display:swap; src:url('/fonts/Inter_18pt-Medium.woff2') format('woff2'); }
    :root { --obsidian:#111111; --white:#FFFFFF; --momentum-blue:#2563EB; --slate-700:#374151; --slate-500:#6B7280; --slate-300:#D1D5DB; --font-display:'Space Grotesk','Helvetica Neue',Arial,sans-serif; --font-ui:'Inter','Helvetica Neue',Arial,sans-serif; }
    *, *::before, *::after { box-sizing:border-box; }
    html, body { min-height:100%; }
    body { min-height:100vh; margin:0; background:var(--white); color:var(--obsidian); font-family:var(--font-ui); -webkit-font-smoothing:antialiased; }
    main { min-height:100vh; display:grid; place-items:center; padding:48px 24px; }
    .login-container { width:min(100%, 420px); }
    .header { text-align:center; margin-bottom:48px; }
    .logo { height:32px; margin-bottom:24px; }
    .logo img { height:100%; width:auto; }
    h1 { margin:0; font-family:var(--font-display); font-size:28px; font-weight:500; letter-spacing:-0.02em; line-height:1.1; }
    .subtitle { margin:12px 0 0 0; font-size:14px; color:var(--slate-500); }
    form { display:flex; flex-direction:column; gap:16px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    label { font-size:13px; font-weight:500; color:var(--obsidian); letter-spacing:0.01em; }
    input { padding:11px 12px; border:1px solid var(--slate-300); border-radius:2px; font-family:var(--font-ui); font-size:15px; color:var(--obsidian); transition:border-color 200ms cubic-bezier(0.4,0,0.2,1); }
    input:focus { outline:none; border-color:var(--momentum-blue); box-shadow:inset 0 0 0 1px var(--momentum-blue); }
    .submit { padding:12px 24px; background:var(--momentum-blue); color:var(--white); border:none; border-radius:2px; font-family:var(--font-ui); font-weight:600; font-size:14px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; margin-top:8px; transition:background 200ms cubic-bezier(0.4,0,0.2,1); }
    .submit:hover { background:#1D4ED8; }
    .error { background:#FEE2E2; border:1px solid #FECACA; padding:12px; border-radius:2px; font-size:13px; color:#991B1B; display:none; margin-bottom:8px; }
    .footer-note { text-align:center; margin-top:32px; font-size:12px; color:var(--slate-500); }
    .footer-note a { color:var(--momentum-blue); text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <div class="login-container">
      <div class="header">
        <div class="logo"><a href="/"><img src="/assets/logos/DSRZ_isotype_black.svg" alt="DSRZ"></a></div>
        <h1>Olympus</h1>
        <p class="subtitle">Ingresa con tu usuario, contraseña y token</p>
      </div>
      <div class="error" id="error-msg"></div>
      <form id="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <div class="field">
          <label for="token">Token</label>
          <input type="text" id="token" name="token" placeholder="8 dígitos" maxlength="8" required>
        </div>
        <button type="submit" class="submit">Acceder</button>
      </form>
      <div class="footer-note">¿Problemas de acceso? Contacta a <a href="mailto:support@dsrzhq.com">support@dsrzhq.com</a></div>
    </div>
  </main>
  <script>
    const VALID_USER = { username: 'dsrzhq@gmail.com', password: '=Suld750726', token: '16835214' };
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const t = document.getElementById('token').value;
      if (u === VALID_USER.username && p === VALID_USER.password && t === VALID_USER.token) {
        window.location.href = '/olympus/inicio';
      } else {
        document.getElementById('error-msg').textContent = 'Usuario, contraseña o token incorrecto.';
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('token').value = '';
      }
    });
  </script>
</body>
</html>
